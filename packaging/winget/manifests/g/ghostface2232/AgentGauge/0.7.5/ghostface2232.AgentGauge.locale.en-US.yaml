ShortDescription: System tray monitor for the usage limits of Claude Code, Codex, Antigravity and GitHub Copilot.
Description: |-
  AgentGauge shows the rate-limit windows, reset times and pace of your AI coding tools in a small
  panel on the Windows taskbar, and warns you as a limit fills up. It reads the sign-in each tool has
  already stored on your PC, read-only, and sends nothing to the developer.

  AgentGauge updates itself: by default it installs a newer release when it starts, which can be
  turned off in its settings.
