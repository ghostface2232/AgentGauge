PackageIdentifier: ghostface2232.AgentGauge
PackageVersion: 0.7.5
PackageLocale: ko-KR
ShortDescription: Claude Code, Codex, Antigravity, GitHub Copilot의 사용량 한도를 보여 주는 시스템 트레이 앱입니다.
Description: |-
  AgentGauge는 AI 코딩 도구의 사용량 한도, 초기화 시각, 사용 속도를 Windows 작업 표시줄의 작은 패널에
  보여 주고, 한도가 차오르면 알려 줍니다. 각 도구가 PC에 저장해 둔 로그인 정보를 읽기 전용으로 사용하며,
  개발자에게는 아무것도 보내지 않습니다.

  AgentGauge는 스스로 업데이트합니다. 기본적으로 시작할 때 새 릴리스를 설치하며, 설정에서 끌 수 있습니다.
