# Add a DMG to an existing release using its exact published app, never a rebuild.
name: mac-dmg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the released ZIP
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p mac/build
          gh release view "$RELEASE_TAG" --json assets > mac/build/assets.json
          if jq -e '.assets[] | select(.name == "AgentGauge-macOS.dmg")' mac/build/assets.json >/dev/null; then
            echo "The release already has a DMG; refusing to replace it."
            exit 1
          fi
          digest="$(jq -r '.assets[] | select(.name == "AgentGauge-macOS.zip") | .digest' mac/build/assets.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh release download "$RELEASE_TAG" --pattern AgentGauge-macOS.zip --dir mac/build
          echo "${digest#sha256:}  mac/build/AgentGauge-macOS.zip" | shasum -a 256 -c -
          ditto -x -k mac/build/AgentGauge-macOS.zip mac/build
          version="$(plutil -extract CFBundleShortVersionString raw mac/build/AgentGauge.app/Contents/Info.plist)"
          test "v$version" = "$RELEASE_TAG"
          lipo -verify_arch arm64 x86_64 mac/build/AgentGauge.app/Contents/MacOS/AgentGauge
      - name: Package and verify DMG
        run: bash mac/scripts/build-dmg.sh "$PWD/mac/build/AgentGauge.app" "$PWD/mac/build/AgentGauge-macOS.dmg"
      - name: Add DMG to release
        run: gh release upload "$RELEASE_TAG" mac/build/AgentGauge-macOS.dmg
